name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Validate (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run lint
        run: ./scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh

      - name: Run application test suite
        run: ./tests/test.sh

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh

      - name: Build image and run smoke tests
        run: ./scripts/build.sh
